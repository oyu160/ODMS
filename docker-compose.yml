# Hugjuulelt: zuwhun ugugdliin san   → docker compose up -d db
# Baiguullagiin serwer: buh sistem     → docker compose up -d --build   (https://localhost eswel https://<DMS_DOMAIN>)
# HTTPS: Caddy urwuu proksi TLS-iig duusgaj, program ruu dotood suljeegeer damjuulna.
#        Program (3000) bolon ugugdliin san gadnaas shuud handagdahgui.
# Hawsralt fail ugugdliin san dotor hadgalagdana (tusdaa failiin san shaardlagagui)
services:
  db:
    image: postgres:17
    container_name: dms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms_password
      POSTGRES_DB: dms
    ports:
      - "127.0.0.1:5433:5432" # zuwhun serweriin uuruus; 5433 — kompiyuter deerh PostgreSQL (5432)-tei dawhtsahgui
    volumes:
      - dms_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: dms-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://dms:dms_password@db:5432/dms?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string-32chars}
      HR_API_URL: ${HR_API_URL:-}
      HR_API_KEY: ${HR_API_KEY:-}
    expose:
      - "3000" # zuwhun dotood suljeend — gadnaas Caddy-eer (HTTPS) damjina

  backup:
    # FBSh-05: ugugdliin sang udur bur nuutsulj, suuliin 30 honogiinhiig ./backups hawtsand hadgalna
    image: postgres:17
    container_name: dms-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://dms:dms_password@db:5432/dms
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "30"
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "sleep 60; while true; do sh /backup.sh || echo 'Нөөцлөлт амжилтгүй'; sleep 86400; done"]

  proxy:
    image: caddy:2
    container_name: dms-proxy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Domein ner. Dotood suljeend: localhost eswel serweriin IP/ner
      DMS_DOMAIN: ${DMS_DOMAIN:-localhost}
      # internal = baiguullagiin dotood gerchilgee (Caddy-iin uuriin CA).
      # Interneted neelttei domeind imeil hayag ugwul Let's Encrypt gerchilgee awtomataar awna.
      DMS_TLS: ${DMS_TLS:-internal}
    ports:
      - "80:80" # HTTP huseltiig HTTPS ruu awtomataar shiljuulne
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dms_pgdata:
  caddy_data:
  caddy_config:
